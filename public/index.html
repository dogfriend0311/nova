<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a23" />
    <meta
      name="description"
      content="Nova - Space Themed Social Gaming Hub. Share clips, favorite songs, track sports stats, and compete in Roblox leagues."
    />
    <title>Nova - Space Themed Social Gaming Hub</title>

    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- OpenGraph Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nova - Space Themed Social Gaming Hub" />
    <meta
      property="og:description"
      content="Connect with gamers, share clips, track sports, and compete in Roblox leagues"
    />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    <meta property="og:url" content="https://nova-social.vercel.app" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nova - Space Themed Social Gaming Hub" />
    <meta
      name="twitter:description"
      content="Connect with gamers, share clips, track sports, and compete in Roblox leagues"
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/twitter-image.png" />

    <!-- Base Styles -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background-color: #07091a;
      }

      #root { width: 100%; height: 100%; }

      /* ── Splash screen ───────────────────────────────── */
      #nova-splash {
        position: fixed; inset: 0; z-index: 99999;
        background: radial-gradient(ellipse at 50% 60%, #10153a 0%, #07091a 70%);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 28px;
        overflow: hidden;
      }

      /* Stars */
      #nova-splash::before, #nova-splash::after {
        content: '';
        position: absolute; inset: 0;
        background-image:
          radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.7) 0%, transparent 100%),
          radial-gradient(1px 1px at 25% 40%, rgba(255,255,255,0.5) 0%, transparent 100%),
          radial-gradient(1.5px 1.5px at 40% 8%, rgba(255,255,255,0.8) 0%, transparent 100%),
          radial-gradient(1px 1px at 60% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
          radial-gradient(1px 1px at 75% 50%, rgba(255,255,255,0.5) 0%, transparent 100%),
          radial-gradient(1.5px 1.5px at 85% 12%, rgba(255,255,255,0.7) 0%, transparent 100%),
          radial-gradient(1px 1px at 90% 70%, rgba(255,255,255,0.4) 0%, transparent 100%),
          radial-gradient(1px 1px at 5% 75%, rgba(255,255,255,0.6) 0%, transparent 100%),
          radial-gradient(1px 1px at 50% 85%, rgba(255,255,255,0.5) 0%, transparent 100%),
          radial-gradient(1.5px 1.5px at 30% 65%, rgba(255,255,255,0.4) 0%, transparent 100%),
          radial-gradient(1px 1px at 70% 90%, rgba(255,255,255,0.6) 0%, transparent 100%),
          radial-gradient(1px 1px at 15% 90%, rgba(255,255,255,0.5) 0%, transparent 100%);
        animation: twinkle 4s ease-in-out infinite alternate;
      }
      #nova-splash::after {
        background-image:
          radial-gradient(1px 1px at 20% 30%, rgba(180,140,255,0.6) 0%, transparent 100%),
          radial-gradient(1px 1px at 55% 55%, rgba(94,129,244,0.7) 0%, transparent 100%),
          radial-gradient(1.5px 1.5px at 80% 35%, rgba(255,100,220,0.5) 0%, transparent 100%),
          radial-gradient(1px 1px at 35% 80%, rgba(94,129,244,0.5) 0%, transparent 100%),
          radial-gradient(1px 1px at 65% 75%, rgba(180,140,255,0.4) 0%, transparent 100%),
          radial-gradient(1px 1px at 92% 50%, rgba(94,129,244,0.6) 0%, transparent 100%),
          radial-gradient(1px 1px at 8% 50%, rgba(255,100,220,0.4) 0%, transparent 100%);
        animation-delay: 1.5s;
      }

      @keyframes twinkle {
        0%   { opacity: 0.6; }
        100% { opacity: 1; }
      }

      /* Glow ring behind logo */
      .splash-glow {
        position: absolute;
        width: 260px; height: 260px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(108,60,231,0.25) 0%, rgba(94,129,244,0.12) 50%, transparent 70%);
        animation: pulse-glow 2.4s ease-in-out infinite;
        z-index: 1;
      }

      @keyframes pulse-glow {
        0%, 100% { transform: scale(1);   opacity: 0.7; }
        50%       { transform: scale(1.18); opacity: 1;   }
      }

      /* Logo */
      .splash-logo {
        position: relative; z-index: 2;
        width: 200px; height: auto;
        animation: logo-in 0.8s cubic-bezier(0.22,1,0.36,1) both;
        filter: drop-shadow(0 0 30px rgba(108,60,231,0.7)) drop-shadow(0 0 60px rgba(94,129,244,0.4));
      }

      @keyframes logo-in {
        from { opacity: 0; transform: scale(0.7) translateY(20px); }
        to   { opacity: 1; transform: scale(1)   translateY(0);    }
      }

      /* Loading bar */
      .splash-bar-track {
        position: relative; z-index: 2;
        width: 180px; height: 3px;
        background: rgba(255,255,255,0.08);
        border-radius: 99px; overflow: hidden;
      }
      .splash-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #6c3ce7, #5e81f4, #c864dc);
        border-radius: 99px;
        animation: bar-fill 1.8s cubic-bezier(0.4,0,0.2,1) forwards;
      }
      @keyframes bar-fill {
        from { width: 0%; }
        to   { width: 100%; }
      }

      /* Text */
      .splash-text {
        position: relative; z-index: 2;
        font-family: 'Orbitron', monospace, sans-serif;
        font-size: 0.72rem; letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(180,170,255,0.55);
        animation: fade-in-text 1s 0.4s ease both;
      }
      @keyframes fade-in-text {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0);   }
      }

      /* Fade out transition */
      #nova-splash.hiding {
        animation: splash-out 0.45s ease forwards;
      }
      @keyframes splash-out {
        to { opacity: 0; pointer-events: none; }
      }

      /* Screen reader only */
      .sr-only {
        position: absolute; width: 1px; height: 1px;
        padding: 0; margin: -1px; overflow: hidden;
        clip: rect(0,0,0,0); white-space: nowrap; border-width: 0;
      }
    </style>
  </head>

  <body>
    <!-- No Script Fallback -->
    <noscript>
      <div style="
        color: #c0d0ff;
        background: #0a0a23;
        padding: 40px 20px;
        text-align: center;
        font-family: 'Space Mono', monospace;
      ">
        <h1 style="font-size: 2rem; margin-bottom: 20px;">Nova Requires JavaScript</h1>
        <p>Please enable JavaScript in your browser to use Nova.</p>
        <p style="margin-top: 10px; font-size: 0.9rem; color: rgba(192, 208, 255, 0.7);">
          Nova is a space-themed social platform for gamers and sports enthusiasts.
        </p>
      </div>
    </noscript>

    <!-- React Root Element -->
    <div id="root"></div>

    <!-- Branded splash screen -->
    <div id="nova-splash" role="status" aria-label="Loading Nova">
      <div class="splash-glow"></div>
      <img class="splash-logo" src="/nova-logo.png" alt="NOVA" />
      <div class="splash-bar-track"><div class="splash-bar-fill"></div></div>
      <span class="splash-text">Loading&hellip;</span>
    </div>

    <script>
      function hideSplash() {
        var splash = document.getElementById('nova-splash');
        if (!splash || splash.dataset.hidden) return;
        splash.dataset.hidden = '1';
        splash.classList.add('hiding');
        setTimeout(function() { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 480);
      }
      window.addEventListener('load', hideSplash);
      setTimeout(hideSplash, 5000);
    </script>
  </body>
</html>
